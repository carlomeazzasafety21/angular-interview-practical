@if (auth.isLoggedIn()) {
  <header class="topbar">
    <a routerLink="/tickets" class="brand">Helpdesk</a>
    <nav>
      <a routerLink="/tickets" routerLinkActive="active">Ticket</a>
      <a routerLink="/stats" routerLinkActive="active">Statistiche</a>
    </nav>
    <div class="user">
      <span>{{ auth.user()?.fullName }}</span>
      <button type="button" class="btn" (click)="auth.logout()">Esci</button>
    </div>
  </header>
}
<main class="container">
  <router-outlet />
</main>
